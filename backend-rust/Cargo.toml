[package]
name = "backend-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
noise = "0.9"
palette = "0.7"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

## networking stuff 
# alternative to pcap would be pnet, which uses raw sockets instead of lib pcap
etherparse = "0.17"
mac_address = "1.1"
pcap = "2.2"

## simulator stuff
# possible we start making more general use of glam in the actual content renderers
miniquad = "0.4"
# glam = { version = "0.30", features = ["scalar-math"] }
glam = "0.30"

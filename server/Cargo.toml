[package]
name = "nova-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
ctrlc = "3.4"
include_dir = "0.7"
mime_guess = "2.0"
noise = "0.9"
palette = "0.7"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

## logging
env_logger = "0.10"
log = "0.4"

## networking 
mac_address = "1.1"
pcap = "2.2"

## simulator
miniquad = "0.4"
glam = "0.30"

[package]
name = "nova-server"
version = "3.0.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
actix-web = "4.15.0"
ctrlc = { version = "3.5.2", features = ["termination"] }
cpal = "0.18.2"
include_dir = "0.7.4"
mime_guess = "2.0.5"
noise = "0.9.0"
palette = "0.7.7"
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

## logging
env_logger = "0.11.11"
log = "0.4.34"

## networking
mac_address = "1.2.1"
pcap = "2.5.0"

## simulator
miniquad = "0.4.11"
glam = "0.34.1"

[package]
name = "nova-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
actix-files = "0.6"
noise = "0.9"
palette = "0.7"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"

## logging
env_logger = "0.10"
log = "0.4"

## networking 
mac_address = "1.1"
pcap = "2.2"

## simulator
miniquad = "0.4"
glam = "0.30"
